[package]
name = "crabblox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crabblox"
path = "src/main.rs"

[[bin]]
name = "macoblox-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2.10", features = ["json"] }
plist = "1.7"
rusqlite = { version = "0.31" }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = "0.1"
zip = "2.1"
anyhow = "1.0"
tempfile = "3.10"
libc = "0.2"
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
gtk4 = { version = "0.11.5" }
glib = { version = "0.22" }
gio = { version = "0.22" }
async-channel = "2.3"
